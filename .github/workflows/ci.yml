# No API keys are needed here. `selftest` runs the scorer oracles and the
# fixture suite; `baselines` runs the null strategies. Together they are the
# gate that `python -m honesty all` applies before it will spend a single
# API call, so CI checks exactly what a contributor is expected to keep green.
name: ci

on:
  push:
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m honesty selftest
      - run: python -m honesty baselines
